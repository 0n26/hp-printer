name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build console
        run: dotnet publish windows/Hp3055Scan/Hp3055Scan.csproj -c Release -r win-x64 --self-contained -o publish/console
      - name: Build GUI
        run: dotnet publish windows/Hp3055ScanGUI/Hp3055ScanGUI/Hp3055ScanGUI.csproj -c Release -r win-x64 --self-contained -o publish/gui
      - name: Package console
        run: Compress-Archive -Path publish/console/* -DestinationPath hp3055scan-windows-console-x64.zip
      - name: Package GUI
        run: Compress-Archive -Path publish/gui/* -DestinationPath hp3055scan-windows-gui-x64.zip
      - name: Upload console
        uses: actions/upload-artifact@v4
        with:
          name: hp3055scan-windows-console-x64
          path: hp3055scan-windows-console-x64.zip
      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: hp3055scan-windows-gui-x64
          path: hp3055scan-windows-gui-x64.zip

  build-macos:
    name: Build macOS backend (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install gawk libtool libusb net-snmp sane-backends
      - name: Build HPLIP backend
        run: ./build-from-source.sh --build-only
      - name: Package macOS
        run: |
          tar -czf hp3055scan-macos-arm64.tar.gz \
            artifacts/ install.sh build-from-source.sh patches/ \
            README.md WINDOWS.md VERSION LICENSE
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: hp3055scan-macos-arm64
          path: hp3055scan-macos-arm64.tar.gz

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download console zip
        uses: actions/download-artifact@v4
        with:
          name: hp3055scan-windows-console-x64
          path: release/
      - name: Download GUI zip
        uses: actions/download-artifact@v4
        with:
          name: hp3055scan-windows-gui-x64
          path: release/
      - name: Download macOS tarball
        uses: actions/download-artifact@v4
        with:
          name: hp3055scan-macos-arm64
          path: release/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.tar.gz
          generate_release_notes: true
